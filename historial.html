                    </div>
                </div>

        </div>

    <div class="container" style="padding-top: 50px; padding-bottom: 60px;">
        <div class="seccion-header" style="margin-bottom: 26px;">
            <h2>Mis Pedidos</h2>
            <p>Historial de tus recargas de saldo y compras de diamantes.</p>
        </div>

        <div class="card" style="overflow-x: auto; padding: 0;">
            <table class="tabla-pedidos" id="tabla-pedidos">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Tipo</th>
                        <th>Detalle</th>
                        <th>Monto</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tabla-pedidos-body">
                    <tr><td colspan="5" class="tabla-vacia">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer id="footer-slot"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="sesion.js"></script>
    <script>
        const ETIQUETAS_ESTADO = { pendiente: 'Pendiente', confirmado: 'Confirmado', completado: 'Completado', cancelado: 'Cancelado' };

        window.onload = async function () {
            const usuario = await verificarSesion();
            if (!usuario) return;
            await cargarPedidos(usuario.id);
            insertarFooter();
        };

        async function cargarPedidos(usuarioId) {
            const cuerpo = document.getElementById('tabla-pedidos-body');
            const { data, error } = await supabaseClient
                .from('pedidos')
                .select('*, paquetes_ff(nombre)')
                .eq('usuario_id', usuarioId)
                .order('created_at', { ascending: false });

            if (error) {
                cuerpo.innerHTML = `<tr><td colspan="5" class="tabla-vacia">No se pudo cargar tu historial.</td></tr>`;
                return;
            }
            if (!data || data.length === 0) {
                cuerpo.innerHTML = `<tr><td colspan="5" class="tabla-vacia">Todavía no tienes pedidos. <a href="catalogo.html" style="color: var(--acento-1); font-weight:600;">Recarga diamantes →</a></td></tr>`;
                return;
            }

            cuerpo.innerHTML = data.map(p => {
                const fecha = new Date(p.created_at).toLocaleString('es-PE', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
                const tipoTxt = p.tipo === 'recarga_saldo' ? 'Recarga de saldo' : 'Compra en catálogo';
                let detalle = '—';
                if (p.tipo === 'compra_diamantes') {
                    const nombrePaquete = p.paquetes_ff ? p.paquetes_ff.nombre : (p.nota_admin ? p.nota_admin.replace('Cantidad personalizada: ', '') : 'Paquete');
                    detalle = escHtml(nombrePaquete) + (p.id_jugador_ff ? ` · ID ${escHtml(p.id_jugador_ff)}` : '');
                }
                return `<tr>
                    <td>${fecha}</td>
                    <td>${tipoTxt}</td>
                    <td>${detalle}</td>
                    <td>${formatearSoles(p.monto)}</td>
                    <td><span class="estado-pill estado-${p.estado}">${ETIQUETAS_ESTADO[p.estado] || p.estado}</span></td>
                </tr>`;
            }).join('');
        }

        function insertarFooter() {
            document.getElementById('footer-slot').outerHTML = `
            <footer>
                <div class="footer-grid">
                    <div class="footer-col">
                        <h4>MZ'Recargas</h4>
                        <p>Tu tienda de confianza para recargas de diamantes de Free Fire. Pagos verificados a mano y entrega rápida.</p>
                    </div>
                    <div class="footer-col">
                        <h4>Enlaces</h4>
                        <ul>
                            <li><a href="catalogo.html">Recargar Diamantes</a></li>
                            <li><a href="historial.html">Mis Pedidos</a></li>
                            <li><a href="soporte.html">Soporte</a></li>
                        </ul>
                    </div>
                    <div class="footer-col">
                        <h4>Legal</h4>
                        <ul>
                            <li><a href="terminos.html">Términos de Servicio</a></li>
                            <li><a href="privacidad.html">Política de Privacidad</a></li>
                        </ul>
                    </div>
                </div>
                <div class="footer-bottom">© ${new Date().getFullYear()} MZ'Recargas. Todos los derechos reservados.</div>
            </footer>`;
        }
    </script>
