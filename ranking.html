</head>
<body>

        <a href="index.html" class="nav-logo-premium">

            <div class="nav-actions-conectado" data-nav-conectado style="display:none; align-items:center; gap:14px;">

                        <button onclick="cerrarSesionSegura()"><span class="material-icons">logout</span> Cerrar Sesión</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 760px; padding-top: 50px; padding-bottom: 70px;">
        <div class="seccion-header">
            <h2>🏆 Ranking de Compradores</h2>
            <p>Ganas 1 punto por cada sol que recargas o gastas en MZ'Recargas. Estos son los que más puntos acumulan.</p>
        </div>

        <div id="podio" class="podio-grid" style="display:none;">
            <div class="podio-card puesto-2">
                <div class="podio-medalla">🥈</div>
                <div class="podio-nickname" id="podio-2-nick">—</div>
                <div class="podio-puntos" id="podio-2-pts"></div>
            </div>
            <div class="podio-card puesto-1">
                <div class="podio-medalla">🥇</div>
                <div class="podio-nickname" id="podio-1-nick">—</div>
                <div class="podio-puntos" id="podio-1-pts"></div>
            </div>
            <div class="podio-card puesto-3">
                <div class="podio-medalla">🥉</div>
                <div class="podio-nickname" id="podio-3-nick">—</div>
                <div class="podio-puntos" id="podio-3-pts"></div>
            </div>
        </div>

        <div class="card" style="overflow-x: auto; padding: 0;">
            <table class="tabla-pedidos tabla-ranking" id="tabla-ranking">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Comprador</th>
                        <th>Puntos</th>
                    </tr>
                </thead>
                <tbody id="tabla-ranking-body">
                    <tr><td colspan="3" class="tabla-vacia">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer id="footer-slot"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="sesion.js"></script>
    <script>
        window.onload = async function () {
            const usuario = await verificarSesion(false);
            if (!usuario) pintarNavInvitado();
            insertarFooter();
            await cargarRanking();
        };

        async function cargarRanking() {
            const cuerpo = document.getElementById('tabla-ranking-body');
            const { data, error } = await supabaseClient.rpc('obtener_ranking', { p_limite: 10 });

            if (error || !data || data.length === 0) {
                cuerpo.innerHTML = `<tr><td colspan="3" class="tabla-vacia">Todavía no hay puntos acumulados. ¡Sé el primero en el ranking!</td></tr>`;
                return;
            }

            const medallas = { 1: '🥇', 2: '🥈', 3: '🥉' };
            if (data[0]) pintarPodio(1, data[0]);
            if (data[1]) pintarPodio(2, data[1]);
            if (data[2]) pintarPodio(3, data[2]);
            if (data.length >= 1) document.getElementById('podio').style.display = 'grid';

            cuerpo.innerHTML = data.map((u, i) => `<tr>
                <td>${medallas[i + 1] || (i + 1)}</td>
                <td>${escHtml(u.nickname)}</td>
                <td style="font-weight:700; color:var(--acento-1);">${u.puntos.toLocaleString('es-PE')}</td>
            </tr>`).join('');
        }

        function pintarPodio(puesto, u) {
            document.getElementById(`podio-${puesto}-nick`).innerText = u.nickname;
            document.getElementById(`podio-${puesto}-pts`).innerText = `${u.puntos.toLocaleString('es-PE')} puntos`;
        }

        function insertarFooter() {
            document.getElementById('footer-slot').outerHTML = `
            <footer>
                <div class="footer-grid">
                    <div class="footer-col">
                        <div class="footer-logo">
                            <img src="logo.svg" alt="MZ'Recargas" style="width:30px; height:30px;">
                            <span style="font-size:18px; font-weight:800;"><span class="text-mz">MZ'</span><span class="text-recargas">Recargas</span></span>
                        </div>
                        <p>Tu tienda de confianza para recargas de diamantes de Free Fire. Pagos verificados a mano y entrega rápida.</p>
                        <div class="footer-metodos-pago">
                            <span class="footer-pago-tag">Yape</span>
                            <span class="footer-pago-tag">Plin</span>
                        </div>
                    </div>
                    <div class="footer-col">
                        <h4>Catálogos</h4>
                        <ul>
                            <li><a href="catalogo.html?catalogo=ilimitada">Recargas Ilimitadas</a></li>
                            <li><a href="catalogo.html?catalogo=promo">Promo Primera Vez</a></li>
                            <li><a href="catalogo.html?catalogo=cajas_tokens">Cajas de Tokens</a></li>
                            <li><a href="catalogo.html?catalogo=tokens_evolutivos">Tokens Evolutivos</a></li>
                        </ul>
                    </div>
                    <div class="footer-col">
                        <h4>Mi Cuenta</h4>
                        <ul>
                            <li><a href="recargar-saldo.html">Recargar Saldo</a></li>
                            <li><a href="historial.html">Mis Pedidos</a></li>
                            <li><a href="perfil.html">Mi Perfil</a></li>
                            <li><a href="ranking.html">Ranking</a></li>
                            <li><a href="soporte.html">Soporte</a></li>
                        </ul>
                    </div>
                    <div class="footer-col">
                        <h4>Legal y Contacto</h4>
                        <ul>
                            <li><a href="terminos.html">Términos de Servicio</a></li>
                            <li><a href="privacidad.html">Política de Privacidad</a></li>
                            <li><a href="https://wa.me/51901150296" target="_blank" rel="noopener">WhatsApp: +51 901 150 296</a></li>
                        </ul>
                    </div>
                </div>
                <div class="footer-bottom">© ${new Date().getFullYear()} MZ'Recargas. Todos los derechos reservados.</div>
            </footer>`;
        }
    </script>
