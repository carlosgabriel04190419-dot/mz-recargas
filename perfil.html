<!DOCTYPE html>
<html lang="es">
<head>

    <script>try{var t=localStorage.getItem('mzrecargas_tema');if(t==="light"||t==="dark")document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-logo-premium">
            <img src="logo.svg" alt="MZ'Recargas" class="logo-img">
            <div class="logo-text"><span class="text-mz">MZ'</span><span class="text-recargas">Recargas</span></div>
        </a>
        <div class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Recargar Diamantes</a>
            <a href="soporte.html">Soporte</a>
        </div>
        <div class="nav-actions">
            <button class="theme-toggle" onclick="alternarTema()" aria-label="Cambiar tema"><span class="material-icons">dark_mode</span></button>
            <div class="nav-actions-conectado" data-nav-conectado style="display:none; align-items:center; gap:14px;">
                <div class="balance-pill"><span class="material-icons">diamond</span><span data-nav-saldo>S/ 0.00</span></div>
                <div class="nav-user-menu">
                    <button class="nav-user-btn" id="nav-user-btn" onclick="alternarMenuUsuario()">
                        <span class="nav-avatar" data-nav-avatar>?</span>
                        <span data-nav-nickname>Usuario</span>
                    </button>
                    <div class="nav-dropdown" id="nav-dropdown">

                        <a href="historial.html"><span class="material-icons">receipt_long</span> Mis Pedidos</a>

                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 560px; padding-top: 50px; padding-bottom: 60px;">
        <div class="seccion-header" style="margin-bottom: 26px;">
            <h2>Mi Perfil</h2>
            <p>Tus datos y tu saldo en MZ'Recargas.</p>
        </div>

        <div class="saldo-card">
            <p style="color: var(--texto-secundario); font-size: 14px;">Saldo disponible</p>
            <div class="monto" data-nav-saldo>S/ 0.00</div>
            <a href="catalogo.html" class="btn-primary" style="display:inline-block;">Recargar Saldo</a>
        </div>

        <div class="card" style="display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:24px; padding:18px 22px;">
            <div>
                <p style="color: var(--texto-secundario); font-size: 13px;">Tus puntos</p>
                <p style="font-size:22px; font-weight:800; color:var(--acento-1);" id="perfil-puntos">0</p>
            </div>
            <a href="ranking.html" class="btn-outline btn-sm">🏆 Ver ranking</a>
        </div>

        <div class="card">
            <div id="msg-box" class="msg-box error"></div>
            <div id="exito-box" class="msg-box exito"></div>

            <label style="display:block; font-size: 13.5px; font-weight: 600; margin-bottom: 7px; color: var(--texto-secundario);">Correo</label>
            <input type="email" id="perfil-correo" class="input-form" disabled style="opacity:0.7;">

            <label style="display:block; font-size: 13.5px; font-weight: 600; margin-bottom: 7px; color: var(--texto-secundario);">Nickname</label>
            <input type="text" id="perfil-nickname" class="input-form">

            <label style="display:block; font-size: 13.5px; font-weight: 600; margin-bottom: 7px; color: var(--texto-secundario);">WhatsApp (opcional)</label>
            <input type="text" id="perfil-celular" class="input-form" placeholder="Ej: 987654321">

            <button type="button" id="btn-guardar" class="btn-primary" style="width:100%; margin-top: 6px;" onclick="guardarPerfil()">Guardar cambios</button>
        </div>
    </div>

    <footer id="footer-slot"></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="sesion.js"></script>
    <script>
        window.onload = async function () {
            const usuario = await verificarSesion();
            if (!usuario) return;
            document.getElementById('perfil-correo').value = usuario.correo;
            document.getElementById('perfil-nickname').value = usuario.nickname;
            document.getElementById('perfil-celular').value = usuario.celular || '';
            document.getElementById('perfil-puntos').innerText = (usuario.puntos || 0).toLocaleString('es-PE');
            insertarFooter();
        };

        async function guardarPerfil() {
            const nickname = document.getElementById('perfil-nickname').value.trim();
            const celular = document.getElementById('perfil-celular').value.trim();
            const btn = document.getElementById('btn-guardar');
            const errBox = document.getElementById('msg-box');
            const okBox = document.getElementById('exito-box');
            errBox.style.display = 'none'; okBox.style.display = 'none';

            if (!nickname) {
                errBox.style.display = 'block';
                errBox.innerText = 'El nickname no puede estar vacío.';
                return;
            }

            btn.disabled = true; btn.innerText = 'Guardando...';
            const { error } = await supabaseClient.rpc('actualizar_mi_perfil', {
                nuevo_nickname: nickname,
                nuevo_celular: celular || null
            });
            btn.disabled = false; btn.innerText = 'Guardar cambios';

            if (error) {
                errBox.style.display = 'block';
                errBox.innerText = 'No se pudo guardar: ' + error.message;
                return;
            }
            okBox.style.display = 'block';
            okBox.innerText = 'Datos actualizados.';
        }

        function insertarFooter() {
            document.getElementById('footer-slot').outerHTML = `
            <footer>
                <div class="footer-grid">
                    <div class="footer-col">
                        <div class="footer-logo">
                            <img src="logo.svg" alt="MZ'Recargas" style="width:30px; height:30px;">
                            <span style="font-size:18px; font-weight:800;"><span class="text-mz">MZ'</span><span class="text-recargas">Recargas</span></span>
                        </div>
                        <p>Tu tienda de confianza para recargas de diamantes de Free Fire. Pagos verificados a mano y entrega rápida.</p>
                        <div class="footer-metodos-pago">
                            <span class="footer-pago-tag">Yape</span>
                            <span class="footer-pago-tag">Plin</span>
                        </div>
                    </div>
                    <div class="footer-col">
                        <h4>Catálogos</h4>
                        <ul>
                            <li><a href="catalogo.html?catalogo=ilimitada">Recargas Ilimitadas</a></li>
                            <li><a href="catalogo.html?catalogo=promo">Promo Primera Vez</a></li>
                            <li><a href="catalogo.html?catalogo=cajas_tokens">Cajas de Tokens</a></li>
                            <li><a href="catalogo.html?catalogo=tokens_evolutivos">Tokens Evolutivos</a></li>
                        </ul>
                    </div>
                    <div class="footer-col">
                        <h4>Mi Cuenta</h4>
                        <ul>
                            <li><a href="recargar-saldo.html">Recargar Saldo</a></li>
                            <li><a href="historial.html">Mis Pedidos</a></li>
                            <li><a href="perfil.html">Mi Perfil</a></li>
                            <li><a href="ranking.html">Ranking</a></li>
                            <li><a href="soporte.html">Soporte</a></li>
                        </ul>
                    </div>
                    <div class="footer-col">
                        <h4>Legal y Contacto</h4>
                        <ul>
                            <li><a href="terminos.html">Términos de Servicio</a></li>
                            <li><a href="privacidad.html">Política de Privacidad</a></li>
                            <li><a href="https://wa.me/51901150296" target="_blank" rel="noopener">WhatsApp: +51 901 150 296</a></li>
                        </ul>
                    </div>
                </div>
                <div class="footer-bottom">© ${new Date().getFullYear()} MZ'Recargas. Todos los derechos reservados.</div>
            </footer>`;
        }
    </script>

    </a>
</body>
